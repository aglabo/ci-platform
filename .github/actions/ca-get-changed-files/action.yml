name: "get-changed-files"
description: |
  Get the files changed by the triggering event and filter them by glob patterns.
  push uses the event's before/after commits, pull_request uses the base/head
  commits, and any other event uses the last commit-count commits (HEAD~N).
  IMPORTANT: The caller's actions/checkout step must use fetch-depth: 0.
  A partial clone is not supported and fails.
  A push of a deleted branch or of a tag is not supported and fails.
  Check out the target repository into the working directory (GITHUB_WORKSPACE);
  do not set the path input of actions/checkout.

inputs:
  commit-count:
    description: "Positive integer N (1-1000) for the HEAD~N range, used for push without a usable before SHA and for events other than push / pull_request."
    required: false
    default: "1"
  pattern:
    description: "Glob patterns, one per line. A line starting with ! excludes matching files. Leave empty to keep every file."
    required: false
    default: ""

outputs:
  files:
    description: "Changed file paths kept by the patterns, one per line. Empty string when none are kept."
    value: ${{ steps.filter-files.outputs.files }}
  count:
    description: "Number of kept files as a decimal integer string without leading zeros or surrounding whitespace."
    value: ${{ steps.filter-files.outputs.count }}

runs:
  using: composite
  steps:
    - name: Resolve SHA range
      id: resolve-sha
      shell: bash
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_REF: ${{ github.ref }}
        GITHUB_EVENT_DELETED: ${{ github.event.deleted }}
        GITHUB_BEFORE_SHA: ${{ github.event.before }}
        GITHUB_AFTER_SHA: ${{ github.sha }}
        GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        INPUT_COMMIT_COUNT: ${{ inputs.commit-count }}
        INPUT_BEFORE_SHA: ""
        INPUT_AFTER_SHA: ""
      run: bash "${GITHUB_ACTION_PATH}/../_ca-resolve-sha/scripts/resolve-sha.sh"

    - name: Get changed files
      id: get-changed-files
      shell: bash
      env:
        BEFORE_SHA: ${{ steps.resolve-sha.outputs.before_sha }}
        AFTER_SHA: ${{ steps.resolve-sha.outputs.after_sha }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/get-changed-files.sh"

    - name: Filter files
      id: filter-files
      shell: bash
      env:
        INPUT_FILES: ${{ steps.get-changed-files.outputs.files }}
        INPUT_PATTERNS: ${{ inputs.pattern }}
      run: bash "${GITHUB_ACTION_PATH}/../_ca-filter-files/scripts/filter-files.sh"
