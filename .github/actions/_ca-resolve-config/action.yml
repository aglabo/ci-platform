name: "_ca-resolve-config"
description: |
  Internal action: resolve the configuration file used by a quality tool.

inputs:
  config:
    description: "Explicit config file path."
    required: false
    default: ""
  local-config:
    description: "Repository-local config file path."
    required: false
    default: ""
  global-config:
    description: "Global config file path."
    required: false
    default: ""

outputs:
  config-file:
    description: "Resolved config file path (absolute)."
    value: ${{ steps.resolve-config.outputs.config-file }}
  source:
    description: "Where the config came from: input, local, or global."
    value: ${{ steps.resolve-config.outputs.source }}

runs:
  using: composite
  steps:
    - name: Resolve config
      id: resolve-config
      shell: bash
      env:
        GITHUB_WORKSPACE: ${{ github.workspace }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_LOCAL_CONFIG: ${{ inputs.local-config }}
        INPUT_GLOBAL_CONFIG: ${{ inputs.global-config }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/resolve-config.sh"
