name: "Reusable: Scan Betterleaks"

# Minimal permissions following security best practices
permissions:
  contents: read

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      version:
        description: "Version of betterleaks to install"
        required: false
        default: "1.10.0"
        type: string
      config-repo:
        description: "Repository checked out to global/configs for the betterleaks config"
        required: false
        default: "aglabo/global-configs"
        type: string
      config:
        description: "Path to the betterleaks configuration file"
        required: false
        default: "./global/configs/betterleaks.toml"
        type: string
      fetch-depth:
        description: "Git history depth to fetch (0 for full history)"
        required: false
        default: 50
        type: number

jobs:
  scan-betterleaks:
    name: Betterleaks Secret Scan
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout target repository
        id: target-checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          persist-credentials: false

      - name: Validate environment
        id: env-validation
        if: steps.target-checkout.outcome == 'success'
        uses: aglabo/ci-platform/.github/actions/ca-validate-environment@v0.6.0
        with:
          actions-type: read

      - name: Install betterleaks
        id: tool-install
        if: steps.env-validation.outcome == 'success'
        uses: aglabo/ci-platform/.github/actions/ca-setup-tool@v0.6.0
        with:
          repo: betterleaks/betterleaks
          tool-version: ${{ inputs.version }}

      - name: Checkout betterleaks config
        id: config-checkout
        if: steps.tool-install.outcome == 'success'
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.config-repo }}
          path: global/configs
          persist-credentials: false

      - name: Prepare report directory
        id: prepare-report
        if: steps.config-checkout.outcome == 'success'
        run: mkdir -p .github/report

      - name: Run betterleaks scan
        id: scan-execute
        if: steps.prepare-report.outcome == 'success'
        env:
          CONFIG_FILE: ${{ inputs.config }}
        run: |
          set +e
          betterleaks git . \
            --config "${CONFIG_FILE}" \
            --report-path=.github/report/betterleaks-report.json \
            --exit-code=1 \
            --verbose
          betterleaks_status=$?
          set -e
          echo "status=${betterleaks_status}" >> "$GITHUB_OUTPUT"
          exit "${betterleaks_status}"

      - name: Upload betterleaks report
        id: upload-report
        if: failure() && steps.scan-execute.outputs.status != '0'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: betterleaks-report
          path: .github/report/betterleaks-report.json
          retention-days: 30
