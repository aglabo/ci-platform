# cspell:words jactionlint jdx

name: "Reusable: QA by jactionlint"

permissions:
  contents: read

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      version:
        description: "Version of jactionlint to install"
        required: false
        default: "2.3.0"
        type: string
      config:
        description: "Path to the jactionlint configuration file"
        required: false
        default: "./shared/configs/jactionlint.yaml"
        type: string

jobs:
  qa-actionlint:
    name: Actionlint Workflow QA
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout target repository
        id: target-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate environment
        id: env-validation
        if: steps.target-checkout.outcome == 'success'
        uses: aglabo/ci-platform/.github/actions/ca-validate-environment@4e2b135f93916b2971f26a070a1084afa9b12a79 # v0.4.1
        with:
          actions-type: read

      - name: Install jactionlint
        id: tool-install
        if: steps.env-validation.outcome == 'success'
        uses: aglabo/ci-platform/.github/actions/ca-setup-tool@4e2b135f93916b2971f26a070a1084afa9b12a79 # v0.4.1
        with:
          repo: jdx/jactionlint
          tool-version: ${{ inputs.version }}

      - name: Checkout jactionlint config
        id: config-checkout
        if: steps.tool-install.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aglabo/.github
          path: shared
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare report directory
        id: prepare-report
        if: steps.config-checkout.outcome == 'success'
        run: mkdir -p .github/report

      - name: Run jactionlint
        id: lint-execute
        if: steps.prepare-report.outcome == 'success'
        env:
          CONFIG_FILE: ${{ inputs.config }}
        run: |
          jactionlint --config-file "${CONFIG_FILE}" 2>&1 | tee .github/report/jactionlint-report.txt
          exit "${PIPESTATUS[0]}"

      - name: Upload jactionlint report
        id: report-upload
        if: failure() && steps.lint-execute.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jactionlint-report
          path: .github/report/jactionlint-report.txt
          retention-days: 30
