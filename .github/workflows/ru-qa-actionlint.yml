# cspell:words jactionlint jdx

name: "Reusable: QA by jactionlint"

permissions:
  contents: read

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      version:
        description: "Version of jactionlint to install"
        required: false
        default: "2.6.0"
        type: string
      config:
        description: "Path to the jactionlint configuration file (empty: use the global-configs file)"
        required: false
        default: ""
        type: string

jobs:
  qa-actionlint:
    name: Actionlint Workflow QA
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout target repository
        id: target-checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate environment
        id: env-validation
        if: steps.target-checkout.outcome == 'success'
        uses: aglabo/ci-platform/.github/actions/ca-validate-environment@v0.7.1-pre
        with:
          actions-type: read

      - name: Install jactionlint
        id: tool-install
        if: steps.env-validation.outcome == 'success'
        uses: aglabo/ci-platform/.github/actions/ca-setup-tool@v0.7.1-pre
        with:
          repo: jdx/jactionlint
          tool-version: ${{ inputs.version }}

      - name: Checkout jactionlint config
        id: config-checkout
        if: steps.tool-install.outcome == 'success'
        uses: actions/checkout@v7.0.1
        with:
          repository: aglabo/global-configs
          path: global/configs
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve jactionlint config
        id: resolve-config
        if: steps.config-checkout.outcome == 'success'
        uses: aglabo/ci-platform/.github/actions/_ca-resolve-config@v0.7.1-pre
        with:
          config: ${{ inputs.config }}
          global-config: global/configs/jactionlint.yaml

      - name: Prepare report directory
        id: prepare-report
        if: steps.resolve-config.outcome == 'success'
        run: mkdir -p .github/report

      - name: Run jactionlint
        id: lint-execute
        if: steps.prepare-report.outcome == 'success'
        env:
          CONFIG_FILE: ${{ steps.resolve-config.outputs.config-file }}
        run: |
          jactionlint --config-file "${CONFIG_FILE}" 2>&1 | tee .github/report/jactionlint-report.txt
          exit "${PIPESTATUS[0]}"

      - name: Upload jactionlint report
        id: report-upload
        if: failure() && steps.lint-execute.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: jactionlint-report
          path: .github/report/jactionlint-report.txt
          retention-days: 30
