# Profile
profile: default

# Online
online: false

# Set the level of a rule by its ID: "error" (fails the run), "warn", "info" or
# "off". A rule with options takes a mapping.
rules:
  missing-timeout: warn
  require-shell: error
  unpinned-uses: error
  max-run-lines:
    level: warn
    max: 120

# Allow full version tags (vX.Y.Z) instead of SHA pinning.
# Other refs (e.g. @v7, @main) are still reported by unpinned-uses.
ignores:
  - rule: unpinned-uses
    uses: /^[^@]+@v[0-9]+\.[0-9]+\.[0-9]+$/
    reason: full version tags are allowed (#171)
