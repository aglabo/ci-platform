# Profile
profile: default

# Online
online: false

# Set the level of a rule by its ID: "error" (fails the run), "warn", "info" or
# "off". A rule with options takes a mapping.
rules:
  missing-timeout: warn # lower the level of a rule the profile enables
  require-shell: error
  unpinned-uses: error
  max-run-lines:
    level: warn
    max: 120
