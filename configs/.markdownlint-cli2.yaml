## Files
# globs:

## Ignores
# ignore gitignore
gitignore: true
# ignore files globs
ignores:
  - "**/__tests__/**" # ignore test fixtures (raw)chatlog data)
  - ".serena/**"
  - ".tools/**"
  - "temp/**"
  - "tmp/**"
  # docs site: lint only aglabo.github.io/docs/
  - "aglabo.github.io/*.md"
  - "aglabo.github.io/build/**"
  - "aglabo.github.io/node_modules/**"
  - "aglabo.github.io/src/**"
  - "aglabo.github.io/static/**"
  - "aglabo.github.io/versioned_docs/**"
  - ".github/**"
  - ".vscode/**"

## ruleset
config:
  extends: .markdownlint.yaml
