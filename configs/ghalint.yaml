# Allow version tags instead of SHA pinning
# (full version tag format is checked by jactionlint: configs/jactionlint.yaml)
excludes:
  - policy_name: action_ref_should_be_full_length_commit_sha
    action_name: actions/*
  - policy_name: action_ref_should_be_full_length_commit_sha
    action_name: pnpm/*
  - policy_name: action_ref_should_be_full_length_commit_sha
    action_name: aglabo/ci-platform/.github/actions/*
  - policy_name: action_ref_should_be_full_length_commit_sha
    action_name: aglabo/ci-platform/.github/workflows/*
